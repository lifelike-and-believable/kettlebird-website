name: Build Website

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      # The same command Vercel runs: the site, the editor into dist/studio, then both into the deployed
      # output with vercel.json's headers and rewrites, and the draft and token check
      # (content-editing-sign-in AC-1, AC-3; content-editing-preview AC-9, AC-12).
      - name: Build website and editor
        run: npm run build:site

      - name: Check the editor is in the build
        run: |
          test -f .vercel/output/static/studio/index.html
          grep -q '<title>Kettlebird Creations</title>' .vercel/output/static/studio/index.html
          grep -q 'src="/studio/static/' .vercel/output/static/studio/index.html
          ! grep -q 'href="/static/' .vercel/output/static/studio/index.html

      # The deployed routing has vercel.json's headers and the /studio rewrite (content-editing-preview AC-12).
      - name: Check the deployed routing
        run: |
          grep -q '"X-Frame-Options": "SAMEORIGIN"' .vercel/output/config.json
          grep -q '"dest": "/studio/index.html"' .vercel/output/config.json

      # The site says which content it was built from (content-editing-know-when-live AC-2).
      - name: Check the build info is in the build
        run: node -e "const i=require('./.vercel/output/static/build-info.json'); if(!Date.parse(i.contentReadAt)||!Date.parse(i.builtAt)) process.exit(1)"

  studio:
    # The editor (Sanity Studio) builds with its custom inputs and actions (comic-publish-pages#AC-14).
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: sanity-studio

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sanity-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the editor
        run: npm run build

  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (fixture build)
        run: npm run test:e2e

      # After the end-to-end tests, so the unit tests can also scan the fixture build in dist/.
      - name: Unit tests
        run: npm run test:unit

      - name: Checkout rules-for-robots (tutorial runner)
        uses: actions/checkout@v4
        with:
          repository: lifelike-and-believable/rules-for-robots
          path: .rfr

      - name: Run tutorials against the fixture build
        # The end-to-end step leaves a fixture build in dist/, served by the Node adapter's own server.
        run: |
          HOST=127.0.0.1 PORT=4325 node dist/server/entry.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4325/comics > /dev/null && break; sleep 2; done
          node .rfr/checks/tutorial-run.mjs . --base-url http://127.0.0.1:4325 --record tutorial-recordings

      - name: Upload tutorial recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-recordings
          path: tutorial-recordings
          if-no-files-found: ignore
