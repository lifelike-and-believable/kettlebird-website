name: Build Website

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

  studio:
    # The editor (Sanity Studio) builds with its custom inputs and actions (comic-publish-pages#AC-14).
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: sanity-studio

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sanity-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the editor
        run: npm run build

  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (fixture build)
        run: npm run test:e2e

      # After the end-to-end tests, so the unit tests can also scan the fixture build in dist/.
      - name: Unit tests
        run: npm run test:unit

      - name: Checkout rules-for-robots (tutorial runner)
        uses: actions/checkout@v4
        with:
          repository: lifelike-and-believable/rules-for-robots
          path: .rfr

      - name: Run tutorials against the fixture build
        # The end-to-end step leaves a fixture build in dist/.
        run: |
          npx astro preview --port 4325 &
          for i in $(seq 1 30); do curl -sf http://localhost:4325/comics > /dev/null && break; sleep 2; done
          node .rfr/checks/tutorial-run.mjs . --base-url http://localhost:4325 --record tutorial-recordings

      - name: Upload tutorial recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-recordings
          path: tutorial-recordings
          if-no-files-found: ignore
