# Copy to .github/workflows/rfr-process.yml in a repository that uses the rfr-process plugin
# (docs/specs/project-process.md in rules-for-robots). Runs the process check, approvals, tier,
# CODEOWNERS, issue sync, docs lint (Vale, advisory), and mutation testing (Stryker, advisory, on
# tier:story and tier:epic pull requests). Change `main` if your default branch has another name.
name: process

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

jobs:
  process:
    # @main follows rules-for-robots as it changes. For stable CI, pin this and rules-ref below to
    # the same release tag or commit.
    uses: lifelike-and-believable/rules-for-robots/.github/workflows/rfr-process.yml@main
    with:
      # Stryker on the unit-tested logic (stryker.config.mjs).
      mutation: true
      # astro check on every pull request, so a type error in a test shows before review (rfr-process 0.10.2).
      typecheck: npm run check
      # The editor's own packages, for tests that load its code (mutation and typecheck jobs).
      install-dirs: sanity-studio
    permissions:
      contents: read
      pull-requests: read
      issues: write
    # Passes RFR_PROJECT_TOKEN, if you have set it, for the Project board (see process.yml's project).
    secrets: inherit
